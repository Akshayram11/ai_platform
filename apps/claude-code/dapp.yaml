# Claude Code in the browser on DataOS: ask it to build and deploy apps. Only the owner can open it: the terminal
# acts with the owner's DataOS identity (DataOS gives the pod the owner's key) and has a shell.
#
#   dapp deploy -f apps/claude-code/dapp.yaml
#   open https://<fqdn>/claude-code/      then sign in with your Claude account in the terminal (/login)
#
# Staying signed in (the /login is lost whenever DataOS restarts or moves the pod): give the app a token.
#   1. in the terminal here:  claude setup-token      (prints a token, valid for a year; copy it)
#   2. on your laptop:        read -s "T?token: " && printf 'CLAUDE_CODE_OAUTH_TOKEN=%s\n' "$T" > /tmp/cc.env \
#                               && dapp secret set claude-code anthropic --from-env-file /tmp/cc.env --no-attach; rm -f /tmp/cc.env; unset T
#   3. add `secrets: [dapp-claude-code-anthropic]` below and deploy again.
# Or an Anthropic API key instead: the same secret with ANTHROPIC_API_KEY=... in the env file.
name: claude-code
title: Claude Code
description: Claude Code in a browser terminal; builds and deploys DataOS apps with dapp
image: docker.io/tmdcio/dapp-claude-code:0.1.7
command: [/opt/claude/start.sh]
port: 8080
compute: engineering-compute
path: /claude-code
# private (DataOS sign-in); the proxy additionally lets only the owner in, even if someone is added to access
metrics: true
resources: {cpu: 500m, memory: 2Gi, cpuLimit: "4", memoryLimit: 4Gi}
secrets: [dapp-claude-code-anthropic]   # CLAUDE_CODE_OAUTH_TOKEN: stays signed in across restarts
env:
  ROOT_PATH: /claude-code
  DATAOS_FQDN: poliks.instance.dataos.cloud
  DAPP_DEFAULT_COMPUTE: engineering-compute
