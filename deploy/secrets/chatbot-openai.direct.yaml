# Only for the chatbot without the gateway (llm: false): the app then holds the real OpenAI key itself.
# Prefer the gateway; this exists so that option is also written down.
#
#   dapp secret apply deploy/secrets/chatbot-openai.direct.yaml --env-file examples/chatbot/.env
# then set `llm: false` and `secrets: [dapp-chatbot-openai]` in examples/chatbot/dapp.yaml and redeploy.
name: dapp-chatbot-openai
version: v2alpha
type: secret
tenant: engineering
tags: [dapp, dapp-app-chatbot]
description: OpenAI key for the chatbot when it calls OpenAI directly
spec:
  type: key-value
  data:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
