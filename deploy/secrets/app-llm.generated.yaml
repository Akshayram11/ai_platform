# SHAPE ONLY, do not apply by hand. `dapp deploy` creates this for every app with `llm: true`.
# The value is the app's own gateway key: "dapp_" + 43 random URL-safe characters, issued by the gateway
# (dapp_gateway/store.py issue_key). The gateway keeps only its SHA-256 hash, so it cannot show it again;
# `dapp deploy --rotate-llm-key` issues a new one and revokes the old.
# The app passes it to the SDK: OpenAI(api_key=os.environ["DAPP_LLM_KEY"]).
name: dapp-<app>-llm
version: v2alpha
type: secret
tenant: engineering
tags: [dapp, dapp-app-<app>]
description: dapp LLM gateway key for <app>
spec:
  type: key-value
  data:
    DAPP_LLM_KEY: <issued by the gateway on deploy>
