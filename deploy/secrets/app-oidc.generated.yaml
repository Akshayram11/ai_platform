# SHAPE ONLY, do not apply by hand. `dapp deploy` creates this once for every app that signs users in
# (the default; not `public: true`). Both values are random (secrets.token_urlsafe(32)).
#  - clientSecret: the key name Poros requires; it registers the app's DataOS login client with it and the
#    app (dapp_login) uses it to complete the sign-in.
#  - DAPP_SESSION_KEY: signs the app's session cookie.
name: dapp-<app>-oidc
version: v2alpha
type: secret
tenant: engineering
tags: [dapp, dapp-app-<app>]
description: dapp sign-in secrets for <app>
spec:
  type: key-value
  data:
    clientSecret: <random, generated on first deploy>
    DAPP_SESSION_KEY: <random, generated on first deploy>
