# The only place the real provider keys live: the gateway reads this secret, apps never see it.
# No key is written in this file: dataos-ctl fills ${VAR} from the environment when it applies.
#
#   cp examples/chatbot/.env.example .env.gateway      # OPENAI_API_KEY=... (and optionally the two below); gitignored
#   dapp secret apply deploy/secrets/dapp-gateway-providers.yaml --env-file .env.gateway --dry-run   # check, applies nothing
#   dapp secret apply deploy/secrets/dapp-gateway-providers.yaml --env-file .env.gateway
#   dapp deploy -f deploy/gateway.dapp.yaml                                       # restart so it reads the secret
# `dapp secret apply` refuses an unset ${VAR}. Plain `dataos-ctl resource apply` would write an empty key over the
# working one, so don't use it for this file.
#
# This replaces the whole secret: list every key the gateway should have.
name: dapp-gateway-providers
version: v2alpha
type: secret
tenant: engineering
tags: [dapp]
description: Provider keys for the dapp LLM gateway
spec:
  type: key-value
  data:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}   # uncomment to let apps call Claude models through the gateway
    # DATABASE_URL: ${DATABASE_URL}             # postgresql+psycopg://... so app keys survive a gateway restart
