# Lets akshaychametmdcio's apps read the DataOS secrets dapp creates for them in the engineering tenant
# (dapp names every secret it creates dapp-<app>-..., so this one grant covers all of them).
# Poros reads an app's secrets as its runAsUser; without this the gateway fails with
# "Forbidden ... predicate 'read', object 'dataos:type:secret:engineering:dapp-gateway-providers'".
# Same shape as the existing engineering grants for vulcan-state-connection / vulcan-object-store-connection.
#
#   dataos-ctl resource apply -f deploy/grants/dapp-secrets-akshay.yaml -l   # lint
#   dataos-ctl resource apply -f deploy/grants/dapp-secrets-akshay.yaml
name: dapp-secrets-all-akshaychametmdcio
version: v2alpha
type: grant
tenant: engineering
tags: [governance, grant, dapp]
description: akshaychametmdcio's dapp apps may read their own secrets
grant:
  policy_use_case_id: use-specific-secret
  subjects:
    - users:id:akshaychametmdcio
  values:
    read-specific-secret-governance:
      - id: engineering:dapp-**
  collection: system
  requester: akshaychametmdcio
  notes: secrets created by dapp (dapp-<app>-...)
  approve: true
