# The apps dashboard:  dapp deploy -f deploy/dashboard.dapp.yaml
name: dapp
title: DataOS Apps
description: See what you've deployed on DataOS, its compute and LLM usage, secrets and access
image: docker.io/tmdcio/dataos-apps:0.1.40
command: [dapp-dashboard]
port: 8080
compute: engineering-compute
path: /dapp
stripPath: true                 # the ingress removes the prefix; ROOT_PATH is only used to build links
metrics: true
objects: true                   # keeps access requests (immortal-obj object access-requests, owned by this app)
replicas: 1                     # sessions are in memory; move them to Redis before scaling out
resources: {cpu: 100m, memory: 256Mi, cpuLimit: "1", memoryLimit: 512Mi}
access:
  users: ["*"]                  # any DataOS user may sign in; every call runs as them, so DataOS permissions still apply
env:
  ROOT_PATH: /dapp
  DATAOS_FQDN: poliks.instance.dataos.cloud
  # DATAOS_TENANT_ID comes from DataOS (the tenant the app runs in)
  DAPP_GATEWAY_INTERNAL_URL: http://dapp-gateway:8080
  # Thanos query frontend in the observability (sentinel) namespace; see
  # dataos-component-install/installs/values/observability-mcp.component.values.yaml for the exact URL.
  # DAPP_PROMETHEUS_URL: http://thanos-query-frontend.<sentinel-namespace>:9090   # not known for poliks yet
