<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · DataOS</title>
<style>
/* Same look as the DataOS Chatbot (examples/chatbot): chats on the left, one conversation in the middle. */
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e4e3de;--accent:#2f5bea;--me:#e9eefc;--hover:#efeee9;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#9a9993;--line:#2e2e2b;--accent:#7d9bff;--me:#232a40;--hover:#262624;--bad:#f87171}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif;display:flex}
aside{width:270px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
aside .top{padding:12px}aside .top button{width:100%}
#chats{flex:1;overflow-y:auto;padding:0 8px 12px}
.chat{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.chat:hover,.chat.on{background:var(--hover)}.chat.on{font-weight:600}
.chat span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .x{border:0;background:none;color:var(--muted);padding:0 4px;visibility:hidden;cursor:pointer}.chat:hover .x,.chat .x:focus{visibility:visible}
.note{color:var(--muted);font-size:12px;padding:10px 14px;border-top:1px solid var(--line)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:12px}
header .name{display:flex;align-items:center;gap:10px;min-width:0}
header .name div{min-width:0}header b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header small{color:var(--muted);white-space:nowrap}header small a{color:inherit}
header .name small{display:block;overflow:hidden;text-overflow:ellipsis}
#menu{display:none;background:none;border:1px solid var(--line);color:inherit;padding:2px 9px}
#log{flex:1;overflow-y:auto;padding:16px;max-width:820px;width:100%;margin:0 auto}
.m{margin:10px 0;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:85%}
.user{background:var(--me);margin-left:auto;width:fit-content}.assistant{background:var(--panel);border:1px solid var(--line)}
.assistant.err{border-color:var(--bad);color:var(--bad)}.assistant.err a{color:inherit}
.thinking{color:var(--muted)}
.tag{color:var(--muted);font-size:12px;margin-top:4px;white-space:normal}
details.tools{color:var(--muted);font-size:12px;margin-top:6px;white-space:normal}
details.tools summary{cursor:pointer}details.tools ul{margin:4px 0 0;padding-left:18px}
details.tools .fail{color:var(--bad)}
.empty{color:var(--muted);text-align:center;margin-top:18vh}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
form{display:flex;gap:8px;padding:12px 16px;max-width:820px;width:100%;margin:0 auto}
textarea{flex:1;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;resize:none;height:48px}
button{font:inherit;border:0;border-radius:10px;padding:8px 18px;background:var(--accent);color:#fff;cursor:pointer}
aside .top button{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .15s}
  body.open aside{transform:none;box-shadow:0 0 40px #0006}#menu{display:inline-block}#who .id{display:none}}
</style>
</head>
<body>
<aside aria-label="Chats">
  <div class="top"><button id="new" type="button">+ New chat</button></div>
  <div id="chats"></div>
  <div class="note">Chats are saved in this browser only.</div>
</aside>
<main>
<header>
  <span class="name"><button id="menu" type="button" title="Chats" aria-label="Chats">☰</button>
    <div><b>{{ title }}</b><small>{{ model }} · Version {{ version }}{% if traced %} · Conversations are recorded for this agent's owner{% endif %}</small></div></span>
  <small id="who"></small>
</header>
<div id="log" role="log" aria-live="polite"></div>
<form id="f"><textarea id="q" aria-label="Message" placeholder="Message {{ title }}…" maxlength="12000" autofocus></textarea><button id="b">Send</button></form>
</main>
<script>
const AGENT = {{ title|tojson }}, MODEL = {{ model|tojson }};
const log = document.getElementById('log'), q = document.getElementById('q'), b = document.getElementById('b');
const listEl = document.getElementById('chats');
let user = '', chats = [], chatId = null, messages = [], pending = null;

// Chats live in this browser, per agent and per signed-in person (apps on one DataOS host share the browser storage).
const key = () => 'dapp-agent:' + location.pathname.replace(/\/+$/, '') + ':' + user;
function load() { try { chats = JSON.parse(localStorage.getItem(key()) || '[]'); } catch { chats = []; } }
function save() { try { localStorage.setItem(key(), JSON.stringify(chats.slice(0, 50))); } catch {} }

// A web address in an error becomes a link (e.g. "connect the tool here").
function linkify(element, text) {
  element.replaceChildren();
  for (const part of String(text).split(/(https?:\/\/[^\s]+)/)) {
    if (/^https?:\/\//.test(part)) {
      const url = part.replace(/[.,)]+$/, ""), link = document.createElement('a');
      link.href = url; link.target = '_blank'; link.rel = 'noopener'; link.textContent = url;
      element.append(link, part.slice(url.length));
    } else if (part) { element.append(part); }
  }
}
function emptyState() {
  const d = document.createElement('div'); d.className = 'empty';
  const t = document.createElement('b'); t.textContent = AGENT;
  d.append(t, 'Ask anything. Enter to send, Shift+Enter for a new line.');
  log.replaceChildren(d);
}
function add(role, text, extra = {}) {
  log.querySelector('.empty')?.remove();
  const d = document.createElement('div'); d.className = 'm ' + role + (extra.cls ? ' ' + extra.cls : ''); d.textContent = text;
  if (extra.tag) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = extra.tag; d.append(t); }
  if (extra.steps?.length) {
    const det = document.createElement('details'); det.className = 'tools';
    const s = document.createElement('summary'); s.textContent = 'Tools called (' + extra.steps.length + ')';
    const ul = document.createElement('ul');
    for (const st of extra.steps) {
      const li = document.createElement('li'); li.textContent = st.server + ' / ' + st.tool + (st.ok ? '' : ' · failed');
      if (!st.ok) li.className = 'fail'; ul.append(li);
    }
    det.append(s, ul); d.append(det);
  }
  log.append(d); log.scrollTop = log.scrollHeight; return d;
}
function render() {
  listEl.replaceChildren();
  for (const c of chats) {
    const row = document.createElement('div'); row.className = 'chat' + (c.id === chatId ? ' on' : ''); row.title = c.title;
    row.tabIndex = 0;
    const t = document.createElement('span'); t.textContent = c.title || 'New chat';
    const x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.textContent = '×';
    x.title = 'Delete this chat'; x.setAttribute('aria-label', 'Delete chat ' + (c.title || ''));
    row.append(t, x);
    row.onclick = () => open(c.id);
    row.onkeydown = e => { if (e.key === 'Enter') open(c.id); };
    x.onclick = e => { e.stopPropagation(); if (!confirm('Delete this chat?')) return;
      chats = chats.filter(o => o.id !== c.id); save(); if (c.id === chatId) newChat(); else render(); };
    listEl.append(row);
  }
}
function open(id) {
  const c = chats.find(o => o.id === id); if (!c) return;
  pending?.abort(); chatId = id; messages = c.messages.slice(); emptyState();
  for (const m of c.turns || []) add(m.role, m.content, m.role === 'assistant' ? {tag: m.tag, steps: m.steps} : {});
  document.body.classList.remove('open'); render();
}
function newChat() {
  pending?.abort(); chatId = null; messages = []; emptyState();
  document.body.classList.remove('open'); render(); q.focus();
}
function remember(userText, turn) {
  let c = chats.find(o => o.id === chatId);
  if (!c) {
    chatId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    c = {id: chatId, title: userText.slice(0, 60), messages: [], turns: []};
  }
  c.messages = messages.slice(-40); c.turns = [...(c.turns || []), {role: 'user', content: userText}, turn].slice(-60);
  chats = [c, ...chats.filter(o => o.id !== c.id)]; save(); render();
}

async function send(e) {
  e?.preventDefault();
  const text = q.value.trim(); if (!text || pending) return;
  const controller = new AbortController(); pending = controller;
  const outgoing = [...messages.slice(-18), {role: 'user', content: text}];
  q.value = ''; b.disabled = true; add('user', text);
  const out = add('assistant', 'Running agent…', {cls: 'thinking'});
  const started = performance.now();
  try {
    const r = await fetch('api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                       body: JSON.stringify({messages: outgoing}), signal: controller.signal});
    let p = {}; try { p = await r.json(); } catch {}
    if (!r.ok) {
      const why = p.detail || p.error;
      throw new Error(r.status === 401 ? 'Sign in again to continue.' :
        Array.isArray(why) ? why.map(x => x.msg).join('. ') : (typeof why === 'string' ? why : 'The agent request failed (HTTP ' + r.status + ').'));
    }
    const tag = MODEL + ' · ' + ((performance.now() - started) / 1000).toFixed(1) + 's';
    out.remove(); add('assistant', p.answer, {tag, steps: p.steps});
    messages = [...outgoing, {role: 'assistant', content: p.answer}];
    remember(text, {role: 'assistant', content: p.answer, tag, steps: p.steps || []});
  } catch (err) {
    if (controller.signal.aborted) return;
    out.className = 'm assistant err'; linkify(out, err.message); q.value = text;
  } finally {
    if (pending === controller) { pending = null; b.disabled = false; q.focus(); }
  }
}

document.getElementById('new').onclick = newChat;
document.getElementById('menu').onclick = () => document.body.classList.toggle('open');
document.getElementById('f').addEventListener('submit', send);
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) send(e); });
emptyState(); load(); render();
fetch('_dapp/me').then(r => r.ok ? r.json() : null).then(me => {
  if (!me) return;
  user = me.id || ''; load(); render();
  const who = document.getElementById('who'), out = document.createElement('a');
  out.href = '_dapp/logout'; out.textContent = 'sign out';
  const id = document.createElement('span'); id.className = 'id'; id.textContent = user + ' · ';
  who.replaceChildren(id, out);
}).catch(() => {});
</script>
</body>
</html>
