{% extends "base.html" %}
{% block title %}Sign in · DataOS Apps{% endblock %}
{% block body %}
<div class="panel" style="max-width:440px;margin:40px auto">
  <h1>Sign in</h1>
  <p class="sub">Use a DataOS API key (<code>dataos-ctl user apikey create</code>). It is checked by Heimdall and kept on the server, not in your browser.</p>
  <form method="post" action="{{ request.scope.root_path }}/login">
    <div class="row" style="flex-direction:column;align-items:stretch">
      <label>API key<input type="password" name="apikey" required autocomplete="off"></label>
      <label>Tenant<input name="tenant" value="{{ tenant }}"></label>
      <button class="primary">Sign in</button>
    </div>
  </form>
</div>
{% endblock %}
