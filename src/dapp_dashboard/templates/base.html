<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DataOS Apps{% endblock %}</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e4e3de;--accent:#2f5bea;--ok:#1f8a4c;--warn:#b26b00;--bad:#c2372f;--code:#f1f0ec}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#9a9993;--line:#2e2e2b;--accent:#7d9bff;--ok:#4cc27e;--warn:#e0a03a;--bad:#ef6b62;--code:#262624}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .brand{font-weight:650}header nav{display:flex;gap:16px;flex:1}
header .who{color:var(--muted);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .label{color:var(--muted);font-size:12px}.kpi .value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .spark{display:block;width:100%;height:36px;color:var(--accent);margin-top:6px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}.pill.bad{color:var(--bad);border-color:currentColor}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0;flex-wrap:wrap}
.tabs a{padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent}.tabs a.on{color:var(--ink);border-color:var(--accent)}
form.inline{display:inline}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
pre,code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto;max-height:560px;white-space:pre-wrap}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:16px;border:1px solid var(--ok);color:var(--ok)}
.flash.err{border-color:var(--bad);color:var(--bad)}
.muted{color:var(--muted)}.empty{color:var(--muted);padding:24px;text-align:center}
</style>
</head>
<body>
<header>
  <span class="brand">DataOS Apps</span>
  {% if s %}
  <nav>
    <a href="{{ request.scope.root_path }}/">Apps</a>
    <a href="{{ request.scope.root_path }}/tools">Tools</a>
    <a href="{{ request.scope.root_path }}/keys">Keys</a>
  </nav>
  <span class="who">{{ s.user_id }} · {{ s.tenant }} · {{ fqdn }}</span>
  {% if s.csrf and s.csrf != 'dev' %}
  <form class="inline" method="post" action="{{ request.scope.root_path }}/logout"><button>Sign out</button></form>
  {% endif %}
  {% endif %}
</header>
<main>
  {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
