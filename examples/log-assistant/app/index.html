<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logs · Log Assistant</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--ink:#1d1d1b;--muted:#6d6d68;--line:#e5e4df;--accent:#0f7b74;--accent-soft:#e3f1ef;
  --warn:#c26a00;--warn-bg:#fff6ea;--err:#c2372f;--err-bg:#fdeeed;--code:#f2f1ed;--ai:#e0322b}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1c1c1a;--ink:#ecebe6;--muted:#9a9993;--line:#2e2e2b;
  --accent:#4fc2b8;--accent-soft:#183331;--warn:#e9a443;--warn-bg:#2b2114;--err:#f0716a;--err-bg:#2e1715;--code:#252522}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13.5px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
a{color:var(--accent)}button,select,input{font:inherit;color:inherit}
.top{padding:14px 22px 0;background:var(--panel);border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);font-size:13px;margin-bottom:10px}
.res{display:flex;align-items:center;gap:14px}.res .icon{width:46px;height:46px;border-radius:10px;background:var(--code);display:grid;place-items:center;font-size:20px}
.res h1{font-size:19px;margin:0;font-weight:600}.res .desc{color:var(--muted)}
.facts{margin:10px 0 0;display:flex;gap:22px;color:var(--muted)}.facts b{color:var(--accent);font-weight:500}
.tabs{display:flex;gap:22px;margin-top:14px}.tabs span{padding:8px 0;color:var(--muted)}.tabs .on{color:var(--accent);border-bottom:2px solid var(--accent);font-weight:600}
.pick{margin-left:auto;display:flex;gap:8px;align-items:center}
.pick select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
main{flex:1;display:flex;min-height:0}
aside{width:250px;border-right:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto}
aside h3{font-size:12.5px;font-weight:500;color:var(--muted);margin:0 0 10px}
.pod{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.pod:hover{background:var(--code)}.pod.on{background:var(--accent-soft);border-color:var(--accent)}
.pod .ph{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--muted)}.pod .ph.running{background:#2f9e5c}
section.logs{flex:1;display:flex;flex-direction:column;min-width:0;padding:12px 16px;gap:10px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--code);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:6px;cursor:pointer}.seg .on{background:var(--accent);color:#fff}
.hint{color:var(--muted)}
.search{flex:0 1 380px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:var(--panel)}
.search input{border:0;outline:0;background:none;flex:1}
.times button{border:0;background:none;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.times button.on{color:var(--accent);background:var(--accent-soft)}
.custom{display:none;gap:6px;align-items:center}.custom.on{display:flex}
.custom input{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel)}
.meta{display:flex;gap:10px;flex-wrap:wrap;font:11.5px ui-monospace,Menlo,monospace;color:var(--muted);text-transform:uppercase}
.meta code{text-transform:none;background:var(--code);padding:2px 7px;border-radius:5px;color:var(--ink)}
.count{display:flex;align-items:center;gap:10px;color:var(--muted)}
.count button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 9px;cursor:pointer}
.count button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.table{flex:1;min-height:80px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  font:12px/1.5 ui-monospace,Menlo,monospace}
.row{display:grid;grid-template-columns:46px 62px 200px 1fr;gap:10px;padding:5px 10px;border-left:3px solid transparent;
  border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.row .n{color:var(--muted);text-align:right}.row .lv{font-weight:700;font-size:10.5px}.row .t{color:var(--muted)}
.row.warn{background:var(--warn-bg);border-left-color:var(--warn)}.row.warn .lv{color:var(--warn)}
.row.error{background:var(--err-bg);border-left-color:var(--err)}.row.error .lv{color:var(--err)}
.empty{padding:28px;text-align:center;color:var(--muted);font-family:system-ui}
.count .sp{flex:1}
#chat{display:none;width:min(460px,42vw);min-width:320px;border-left:2px solid var(--ai);background:var(--panel);flex-direction:column}
#chat.on{display:flex}
.chead{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line)}
.chead b{color:var(--ai)}.chead .ctx{color:var(--muted);font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead button{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 9px;cursor:pointer}
#msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.m.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.m.bot{align-self:flex-start;background:var(--code);border-bottom-left-radius:3px}
.m.bot code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:12px}
.steps{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.steps span{font:11px ui-monospace,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--muted)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:4px 11px;cursor:pointer;color:var(--muted)}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
form.ask{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
form.ask input{flex:1;border:1px solid var(--line);border-radius:20px;padding:8px 14px;background:var(--bg);outline:0}
form.ask button{border:0;background:var(--ai);color:#fff;border-radius:20px;padding:8px 18px;font-weight:600;cursor:pointer}
form.ask button:disabled{opacity:.5}
.err{color:var(--err)}
@media (max-width:820px){aside{display:none}.row{grid-template-columns:34px 48px 1fr}.row .t{display:none}
  main{flex-direction:column}#chat{width:auto;min-width:0;height:50vh;border-left:0;border-top:2px solid var(--ai)}}
</style></head>
<body>
<div class="top">
  <div class="crumb">← Resources · <span id="crumbname">…</span> · Logs</div>
  <div class="res">
    <div class="icon">▦</div>
    <div><h1 id="rname">Loading…</h1><div class="desc" id="rdesc"></div></div>
    <div class="pick">
      <select id="kind" title="Kind of resource (the ones that run pods, so have logs)">
        <option value="app">app</option><option value="service">service</option><option value="vulcan">vulcan (data product)</option>
        <option value="minerva">minerva</option><option value="lakehouse">lakehouse</option>
        <option value="lakehouse-rustfs">lakehouse-rustfs</option><option value="nilus">nilus (pipeline)</option>
        <option value="workflow">workflow</option><option value="worker">worker</option></select>
      <select id="resource" title="Resource"></select>
    </div>
  </div>
  <div class="facts"><span>Build: <b id="build">…</b></span><span>Runtime: <b id="runtime">…</b></span></div>
  <div class="tabs"><span>Overview</span><span class="on">Logs</span><span>Usage</span><span>Access</span></div>
</div>
<main>
  <aside><h3>Select a pod</h3><div id="pods"></div></aside>
  <section class="logs">
    <div class="bar">
      <div class="seg"><button data-mode="live">Live</button><button data-mode="historical" class="on">Historical</button></div>
      <span class="hint" id="modehint">Viewing stored logs · select a time range</span>
    </div>
    <div class="bar">
      <label class="search">🔍<input id="q" placeholder="Enter keyword (Enter to search)"></label>
      <span class="times" id="times">
        <button data-since="1m">1m</button><button data-since="5m">5m</button><button data-since="15m">15m</button>
        <button data-since="30m">30m</button><button data-since="1h" class="on">1h</button><button data-since="12h">12h</button>
        <button data-since="24h">24h</button><button data-since="7d">7d</button><button data-since="custom">Custom 📅</button>
      </span>
      <span class="custom" id="custom"><input type="datetime-local" id="from"> → <input type="datetime-local" id="to">
        <button id="applycustom" class="hint">apply (UTC)</button></span>
    </div>
    <div class="meta"><span>Container</span><code id="mcontainer">–</code><span>Time range</span><code id="mrange">–</code></div>
    <div class="count"><span id="showing">–</span>
      <button id="oldest">↑ Oldest</button><button id="latest" class="on">↓ Latest</button>
      <span class="sp"></span><button id="aibtn" title="Ask the AI about these logs">✦ Ask AI</button></div>
    <div class="table" id="table"><div class="empty">Pick a resource.</div></div>
  </section>
<div id="chat">
  <div class="chead"><b>✦ Log Assistant</b><span class="ctx" id="ctx"></span><button id="clear">New chat</button><button id="close">✕</button></div>
  <div id="msgs"></div>
  <div class="sugg" id="sugg">
    <button>Is anything wrong in this window?</button><button>Summarize what happened in the last 24h</button>
    <button>Were there any errors or crashes yesterday?</button><button>Is it running right now? Which pods?</button>
  </div>
  <form class="ask" id="ask"><input id="question" placeholder="Ask about these logs… (e.g. kal raat 2 baje kya error aaya?)" autocomplete="off">
    <button id="send">Ask</button></form>
</div>
</main>
<script>
(() => {
  const ROOT = "__ROOT__", $ = id => document.getElementById(id);
  const S = {kind: "app", name: null, mode: "historical", q: "", since: "1h", start: null, end: null, pod: null, order: "latest", lines: []};
  let chat = [];
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  // A restarting app (an access change restarts it for ~40 s) or a moving gateway answers with DataOS's / Cloudflare's own HTML
  // error page: never show that HTML; retry a few times, then say it in one sentence.
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function api(path, opts, tries = 4) {
    for (let i = 1; ; i++) {
      let r, t;
      try { r = await fetch(ROOT + path, opts); t = await r.text(); }
      catch (e) { if (i < tries) { await sleep(3000 * i); continue; } throw new Error("Can't reach the app right now. Check your connection and try again."); }
      let d; try { d = JSON.parse(t); } catch { d = null; }
      if (r.ok && d !== null) return d;
      const busy = [502, 503, 504, 520, 521, 522, 523, 524].includes(r.status) || (!r.ok && d === null);
      if (busy && i < tries) { await sleep(3000 * i); continue; }
      if (d && d.detail) throw new Error(typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail));
      throw new Error(r.status === 401 || r.status === 403 ? "Your sign-in expired: reload the page." :
        `The app is not answering right now (HTTP ${r.status}); it may be restarting, e.g. after an access change. Try again in a minute.`);
    }
  }
  async function loadResources() {
    $("resource").innerHTML = "<option>loading…</option>";
    try {
      const rows = await api(`/api/resources?kind=${S.kind}`);
      $("resource").innerHTML = rows.map(r => `<option value="${esc(r.name)}">${esc(r.name)}${r.owner ? " · " + esc(r.owner) : ""}</option>`).join("")
        || `<option value="">no ${S.kind}s you may watch</option>`;
      const want = new URLSearchParams(location.search).get("name");
      S.name = rows.find(r => r.name === want) ? want : (rows[0] && rows[0].name) || null;
      $("resource").value = S.name || "";
      await loadResource();
    } catch (e) { $("table").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
  }
  async function loadResource() {
    S.pod = null;
    $("rname").textContent = S.name || "—"; $("crumbname").textContent = S.name || "—";
    if (!S.name) return;
    try {
      const rows = await api(`/api/resources?kind=${S.kind}`);
      $("rdesc").textContent = (rows.find(r => r.name === S.name) || {}).description || "";
      const st = await api(`/api/status?kind=${S.kind}&name=${encodeURIComponent(S.name)}`);
      $("build").textContent = st.state || "?"; $("runtime").textContent = st.runtime || "?";
      const pods = (st.pods || []).filter(p => p.dataplane !== "hub");
      $("pods").innerHTML = `<button class="pod on" data-pod="">All pods</button>` + pods.map(p =>
        `<button class="pod" data-pod="${esc(p.pod)}" title="${esc(p.pod)}"><span class="ph ${esc(p.phase)}"></span>${esc(p.pod)}</button>`).join("");
    } catch (e) { $("build").textContent = "?"; $("runtime").textContent = e.message; }
    loadLogs(); paintCtx();
  }
  async function loadLogs() {
    if (!S.name) return;
    $("table").innerHTML = `<div class="empty">Loading logs…</div>`;
    const p = new URLSearchParams({name: S.name, kind: S.kind, mode: S.mode, q: S.q || "*", limit: "500"});
    if (S.pod) p.set("pod", S.pod);
    if (S.start) { p.set("start", S.start); p.set("end", S.end || "now"); p.delete("since"); } else p.set("since", S.since);
    try {
      const d = await api(`/api/logs?${p}`);
      S.lines = d.lines || [];
      $("mcontainer").textContent = S.mode === "live" ? "running pods" : (d.container || "all");
      $("mrange").textContent = S.mode === "live" ? "now (last lines)" :
        (S.start ? `${S.start} → ${S.end || "now"} UTC` : `last ${S.since}`);
      $("showing").textContent = `Showing ${S.lines.length}${d.total != null && d.total !== S.lines.length ? " of " + d.total : ""}` +
        (S.q ? ` · “${S.q}”` : "");
      paintLines();
    } catch (e) { $("table").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
    paintCtx();
  }
  function level(m) { return /\b(error|exception|traceback|fatal|failed)\b/i.test(m) ? "error" : (/\bwarn(ing)?\b/i.test(m) ? "warn" : "info"); }
  function paintLines() {
    const rows = S.order === "latest" ? [...S.lines].reverse() : S.lines;
    $("table").innerHTML = rows.length ? rows.map((l, i) => {
      const lv = level(l.message);
      return `<div class="row ${lv}"><span class="n">${S.order === "latest" ? rows.length - i : i + 1}</span>` +
        `<span class="lv">${lv.toUpperCase()}</span><span class="t">${esc(l.time ? l.time.replace("T", " ").slice(0, 23) : (l.pod || "").slice(-18))}</span>` +
        `<span>${esc(l.message)}</span></div>`;
    }).join("") : `<div class="empty">No log lines here. Try a wider time range or another keyword.</div>`;
  }
  function paintCtx() {
    $("ctx").textContent = S.name ? `${S.kind} ${S.name} · ${S.mode}` + (S.pod ? ` · ${S.pod}` : "") +
      (S.mode === "live" ? "" : S.start ? ` · ${S.start} → ${S.end || "now"}` : ` · last ${S.since}`) + (S.q ? ` · “${S.q}”` : "") : "";
  }
  // controls
  $("kind").onchange = e => { S.kind = e.target.value; loadResources(); };
  $("resource").onchange = e => { S.name = e.target.value; loadResource(); };
  $("pods").onclick = e => { const b = e.target.closest(".pod"); if (!b) return;
    document.querySelectorAll(".pod").forEach(x => x.classList.toggle("on", x === b)); S.pod = b.dataset.pod || null; loadLogs(); };
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    S.mode = b.dataset.mode; document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
    $("modehint").textContent = S.mode === "live" ? "The running pods' last lines" : "Viewing stored logs · select a time range";
    $("times").style.display = S.mode === "live" ? "none" : ""; $("q").disabled = S.mode === "live"; loadLogs(); });
  $("q").onkeydown = e => { if (e.key === "Enter") { S.q = e.target.value.trim(); loadLogs(); } };
  $("times").onclick = e => { const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#times button").forEach(x => x.classList.toggle("on", x === b));
    if (b.dataset.since === "custom") { $("custom").classList.add("on"); return; }
    $("custom").classList.remove("on"); S.since = b.dataset.since; S.start = S.end = null; loadLogs(); };
  $("applycustom").onclick = () => { const f = $("from").value, t = $("to").value; if (!f) return;
    S.start = f + ":00Z"; S.end = t ? t + ":00Z" : null; loadLogs(); };
  $("oldest").onclick = () => { S.order = "oldest"; $("oldest").classList.add("on"); $("latest").classList.remove("on"); paintLines(); };
  $("latest").onclick = () => { S.order = "latest"; $("latest").classList.add("on"); $("oldest").classList.remove("on"); paintLines(); };
  // chat
  const showChat = on => { $("chat").classList.toggle("on", on); $("aibtn").classList.toggle("on", on); if (on) $("question").focus(); };
  $("aibtn").onclick = () => showChat(!$("chat").classList.contains("on"));
  $("close").onclick = () => showChat(false);
  $("clear").onclick = () => { chat = []; $("msgs").innerHTML = ""; $("sugg").style.display = ""; };
  $("sugg").onclick = e => { const b = e.target.closest("button"); if (b) ask(b.textContent); };
  $("ask").onsubmit = e => { e.preventDefault(); const q = $("question").value.trim(); if (q) ask(q); };
  function md(s) { return esc(s).replace(/```([\s\S]*?)```/g, (_, c) => `<code>${c.trim()}</code>`)
    .replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
  function add(role, html) { const d = document.createElement("div"); d.className = "m " + role; d.innerHTML = html;
    $("msgs").appendChild(d); $("msgs").scrollTop = $("msgs").scrollHeight; return d; }
  async function ask(q) {
    $("sugg").style.display = "none"; $("question").value = ""; $("send").disabled = true;
    add("user", esc(q)); chat.push({role: "user", content: q});
    const wait = add("bot", "Looking at the logs…");
    const slow = setTimeout(() => { if (wait.textContent.startsWith("Looking")) wait.textContent = "Still looking (the app may be restarting)…"; }, 8000);
    try {
      const d = await api("/api/chat", {method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({messages: chat, context: {name: S.name, kind: S.kind, mode: S.mode, q: S.q || null,
          since: S.start ? null : S.since, start: S.start, end: S.end, pod: S.pod}})});
      const steps = (d.steps || []).map(s => `<span title="${esc(JSON.stringify(s.args))}">${esc(s.tool)} → ${esc(s.result)}</span>`).join("");
      wait.innerHTML = (steps ? `<div class="steps">${steps}</div>` : "") + md(d.answer || "(no answer)");
      chat.push({role: "assistant", content: d.answer || ""});
    } catch (e) { wait.innerHTML = `<span class="err">${esc(e.message)}</span>`; chat.pop(); }
    clearTimeout(slow);
    $("send").disabled = false; $("msgs").scrollTop = $("msgs").scrollHeight;
  }
  loadResources();
})();
</script>
</body></html>
