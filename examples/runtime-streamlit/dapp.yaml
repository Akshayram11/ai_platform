# A Streamlit app deployed from source on the dapp Python runtime: no Dockerfile, no image build, no registry.
#   dapp deploy -f examples/runtime-streamlit/dapp.yaml
# dapp packs ./app into the secret dapp-runtime-demo-code; the runtime unpacks it, installs requirements.txt on
# top of its pre-installed libraries (streamlit, pandas, fastapi, openai, ...) and runs `run:`.
name: runtime-demo
description: Streamlit app running from source on dapp-runtime:python-3.12
runtime: python-3.12
code: ./app
run: streamlit run app.py --server.port 8080 --server.address 0.0.0.0 --server.headless true --server.baseUrlPath runtime-demo --browser.gatherUsageStats false
compute: engineering-compute
path: /runtime-demo
public: true             # experiment: dapp's sign-in doesn't wrap non-ASGI apps (Streamlit) yet
metrics: true
resources: {cpu: 100m, memory: 256Mi, cpuLimit: "1", memoryLimit: 768Mi}
