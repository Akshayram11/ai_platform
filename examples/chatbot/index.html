<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataOS Chatbot</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e4e3de;--accent:#2f5bea;--me:#e9eefc;--hover:#efeee9}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#9a9993;--line:#2e2e2b;--accent:#7d9bff;--me:#232a40;--hover:#262624}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif;display:flex}
aside{width:270px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
aside .top{padding:12px}aside .top button{width:100%}
#chats{flex:1;overflow-y:auto;padding:0 8px 12px}
.chat{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.chat:hover,.chat.on{background:var(--hover)}.chat.on{font-weight:600}
.chat span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .x{border:0;background:none;color:var(--muted);padding:0 4px;visibility:hidden;cursor:pointer}.chat:hover .x{visibility:visible}
.note{color:var(--muted);font-size:12px;padding:10px 14px;border-top:1px solid var(--line)}
.note.off{border-top:0}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:12px}
header small{color:var(--muted)}#menu{display:none;background:none;border:1px solid var(--line);color:inherit;padding:2px 9px}
#log{flex:1;overflow-y:auto;padding:16px;max-width:820px;width:100%;margin:0 auto}
.m{margin:10px 0;padding:10px 14px;border-radius:12px;white-space:pre-wrap;max-width:85%}
.user{background:var(--me);margin-left:auto}.assistant{background:var(--panel);border:1px solid var(--line)}
.tag{color:var(--muted);font-size:12px;margin-top:4px}
.empty{color:var(--muted);text-align:center;margin-top:20vh}
form{display:flex;gap:8px;padding:12px 16px;max-width:820px;width:100%;margin:0 auto}
textarea{flex:1;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;resize:none;height:48px}
button{font:inherit;border:0;border-radius:10px;padding:8px 18px;background:var(--accent);color:#fff;cursor:pointer}
aside .top button{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 6px}
@media (max-width:760px){aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .15s}
  body.open aside{transform:none;box-shadow:0 0 40px #0006}#menu{display:inline-block}}
</style>
</head>
<body>
<aside>
  <div class="top"><button id="new">+ New chat</button></div>
  <div id="chats"></div>
  <div class="note" id="note"></div>
</aside>
<main>
<header><span><button id="menu" title="Chats">☰</button> <b>DataOS Chatbot</b></span>
<small><span id="who"></span><label>model <select id="model" title="Switch model">
<option>{{MODEL}}</option></select></label></small></header>
<div id="log"><div class="empty">Ask anything. Enter to send, Shift+Enter for a new line.</div></div>
<form id="f"><textarea id="q" placeholder="Message…" autofocus></textarea><button id="b">Send</button></form>
</main>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), b = document.getElementById('b');
const listEl = document.getElementById('chats'), note = document.getElementById('note');
let messages = [], chatId = null;
const sel = document.getElementById('model');
const SAVED = (() => { try { return localStorage.getItem('dapp-chat-model'); } catch { return null; } })();
let wanted = new URLSearchParams(location.search).get('model') || SAVED, touched = false;     // ?model=name opens the chat on that model
function renderModels(m) {                                                    // runs every 10 s: a model you deploy shows up here
  const keep = touched ? sel.value : (wanted || sel.value);
  sel.replaceChildren(...m.models.map(x => {
    const st = (m.status || {})[x] || {}, o = document.createElement('option');
    o.value = x; o.textContent = x === m.default ? x : x + (st.ready === false ? ' (in DataOS, starting…)' : ' (in DataOS)');
    return o;
  }));
  if (m.models.includes(keep)) sel.value = keep; else sel.value = m.default;
}
function loadModels() { fetch('api/models').then(r => r.ok ? r.json() : null).then(m => { if (m) renderModels(m); }).catch(() => {}); }
loadModels(); setInterval(loadModels, 10000);
sel.addEventListener('change', () => { touched = true; wanted = sel.value; try { localStorage.setItem('dapp-chat-model', sel.value); } catch {} });
fetch('_dapp/me').then(r => r.ok ? r.json() : null).then(me => { if (me) document.getElementById('who').innerHTML =
  `${me.id} · <a href="_dapp/logout" style="color:inherit">sign out</a> · `; }).catch(() => {});

function add(role, text, model, secs) {
  log.querySelector('.empty')?.remove();
  const d = document.createElement('div'); d.className = 'm ' + role; d.textContent = text;
  if (model) tag(d, model, secs);
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function tag(d, model, secs) {
  const t = document.createElement('div'); t.className = 'tag';
  t.textContent = secs == null ? model : `${model} · ${secs.toFixed(1)}s`; d.appendChild(t);
}
function clearLog() {
  log.innerHTML = '<div class="empty">Ask anything. Enter to send, Shift+Enter for a new line.</div>';
}

async function refresh() {            // the saved conversations (immortal-obj), newest first
  try {
    const h = await (await fetch('api/history')).json();
    note.className = 'note' + (h.enabled ? '' : ' off');
    note.textContent = h.enabled ? 'Saved in your immortal-obj storage: it survives restarts and redeploys.'
      : (h.error ? 'History is unavailable right now.' : '');
    listEl.innerHTML = '';
    for (const c of h.chats || []) {
      const row = document.createElement('div'); row.className = 'chat' + (c.id === chatId ? ' on' : ''); row.title = c.title;
      const t = document.createElement('span'); t.textContent = c.title || 'New chat';
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.title = 'Delete this chat';
      row.append(t, x);
      row.onclick = () => openChat(c.id);
      x.onclick = async e => { e.stopPropagation(); if (!confirm('Delete this chat?')) return;
        await fetch('api/history/' + c.id, {method: 'DELETE'}); if (c.id === chatId) newChat(); refresh(); };
      listEl.appendChild(row);
    }
  } catch {}
}
async function openChat(id) {
  const r = await fetch('api/history/' + id); if (!r.ok) return;
  const h = await r.json(); chatId = id; messages = h.messages.map(m => ({role: m.role, content: m.content}));
  clearLog(); h.messages.forEach(m => add(m.role, m.content, m.role === 'assistant' ? m.model : null));
  document.body.classList.remove('open'); refresh();
}
function newChat() { chatId = null; messages = []; clearLog(); document.body.classList.remove('open'); refresh(); q.focus(); }
document.getElementById('new').onclick = newChat;
document.getElementById('menu').onclick = () => document.body.classList.toggle('open');

async function send(e) {
  e?.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; b.disabled = true;
  messages.push({role: 'user', content: text}); add('user', text);
  const out = add('assistant', '…'); let reply = ''; const model = sel.value;
  const started = performance.now();
  try {
    const r = await fetch('api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                       body: JSON.stringify({messages, model, chat_id: chatId})});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    chatId = r.headers.get('X-Chat-Id') || chatId;
    const reader = r.body.getReader(), dec = new TextDecoder();
    for (;;) { const {done, value} = await reader.read(); if (done) break;
      reply += dec.decode(value, {stream: true}); out.textContent = reply; log.scrollTop = log.scrollHeight; }
    messages.push({role: 'assistant', content: reply});
    tag(out, model, (performance.now() - started) / 1000);
  } catch (err) { out.textContent = 'Request failed: ' + err.message; messages.pop(); }
  b.disabled = false; q.focus(); refresh();
}
document.getElementById('f').addEventListener('submit', send);
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) send(e); });
refresh();
</script>
</body>
</html>
